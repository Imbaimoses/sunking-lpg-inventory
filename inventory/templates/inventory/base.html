<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Sunking LPG Inventory
        {% endblock %}
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        /* =========================
           NAVIGATION
        ========================= */

        .navbar {
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            min-height: 65px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .brand {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
        }

        .brand span {
            color: #facc15;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-links a {
            color: #d1d5db;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-links a:hover {
            background: #1f2937;
            color: white;
        }

        .nav-links a.active {
            background: #2563eb;
            color: white;
        }

        /* =========================
           PAGE CONTENT
        ========================= */

        .page-content {
            min-height: calc(100vh - 65px);
        }

        /* =========================
           MESSAGES
        ========================= */

        .messages {
            max-width: 1200px;
            margin: 20px auto 0;
            padding: 0 20px;
        }

        .message {
            padding: 13px 16px;
            border-radius: 7px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .message.warning {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
        }

        .message.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        /* =========================
           MOBILE NAVIGATION
        ========================= */

        @media (max-width: 800px) {

            .navbar {
                flex-direction: column;
                align-items: stretch;
                padding: 12px 15px;
                gap: 10px;
            }

            .brand {
                text-align: center;
            }

            .nav-links {
                overflow-x: auto;
                justify-content: flex-start;
                padding-bottom: 3px;
            }

            .nav-links a {
                white-space: nowrap;
                padding: 10px 12px;
                font-size: 13px;
            }

            .page-content {
                min-height: calc(100vh - 120px);
            }
        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <!-- =========================
         NAVIGATION BAR
    ========================= -->

    <nav class="navbar">

        <a href="{% url 'inventory_list' %}" class="brand">
            SUN<span>KING</span> LPG
        </a>

        <div class="nav-links">

            <a
                href="{% url 'inventory_list' %}"
                class="{% if request.resolver_match.url_name == 'inventory_list' %}active{% endif %}"
            >
                Inventory
            </a>

            <a
                href="{% url 'scan_in' %}"
                class="{% if request.resolver_match.url_name == 'scan_in' %}active{% endif %}"
            >
                Scan In
            </a>

            <a
                href="{% url 'mass_scan' %}"
                class="{% if request.resolver_match.url_name == 'mass_scan' %}active{% endif %}"
            >
                Mass Scan
            </a>

            <a
                href="{% url 'transaction_history' %}"
                class="{% if request.resolver_match.url_name == 'transaction_history' %}active{% endif %}"
            >
                History
            </a>

        </div>

    </nav>


    <!-- =========================
         DJANGO MESSAGES
    ========================= -->

    {% if messages %}

        <div class="messages">

            {% for message in messages %}

                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}


    <!-- =========================
         PAGE CONTENT
    ========================= -->

    <main class="page-content">

        {% block content %}
        {% endblock %}

    </main>


    {% block extra_js %}
    {% endblock %}

</body>
</html>
